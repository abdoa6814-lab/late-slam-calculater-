<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LS Deep Dive Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:40px}
.card{max-width:820px;margin:auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px #0001}
h1{margin:0 0 8px}.sub{color:#666}.row{margin:18px 0}label{display:block;font-weight:700;margin-bottom:8px}
input,button{width:100%;padding:12px;box-sizing:border-box}button{background:#111;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}
#status{margin-top:20px;white-space:pre-wrap;font-weight:600}
</style></head>
<body>
<div class="card">
<h1>📊 LS Deep Dive Generator</h1>
<p class="sub">Generate the LS Deep Dive Excel in the standard 6-sheet format.</p>
<form id="form">
<div class="row"><label>Late Slam Raw Data CSV</label><input type="file" name="raw_data_file" accept=".csv" required></div>
<div class="row"><label>Inventory Audit CSV</label><input type="file" name="inventory_audit_file" accept=".csv" required></div>
<div class="row"><label>Store Code (optional)</label><input type="text" name="store_code" placeholder="e.g. QAA8"></div>
<button type="submit">RUN LS DEEP DIVE</button>
</form><div id="status"></div>
</div>
<script>
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();const s=document.getElementById('status');s.textContent='Processing...';
 try{const r=await fetch('/generate',{method:'POST',body:new FormData(e.target)});
 if(!r.ok){s.textContent=await r.text();return}
 const total=r.headers.get('X-Total-Orders')||'0',ls=r.headers.get('X-Late-Slams')||'0',rate=r.headers.get('X-LS-Rate')||'0';
 const b=await r.blob(),cd=r.headers.get('Content-Disposition')||'',m=cd.match(/filename="?([^"]+)"?/);
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=m?m[1]:'LS_DeepDive.xlsx';a.click();
 s.textContent=`Done — Excel generated.\n\nTotal Orders: ${total}\nLate Slams: ${ls}\nLate Slam Rate: ${rate}%`;
 }catch(err){s.textContent='Error: '+err}
});
</script></body></html>
